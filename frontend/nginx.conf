server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (SEC-6). `always` las añade también a las respuestas de error.
    # Ojo: nginx NO hereda `add_header` a un bloque `location` que define los suyos; por eso el
    # bloque de estáticos repite `nosniff`.
    # HSTS no va aquí: este servidor escucha en :80 y el TLS termina en un componente externo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # CSP en modo solo-reporte hasta verificar en el navegador (Login, Directorio, Ficha con mapa y
    # Dashboard sin violaciones en consola); entonces el nombre pasa a Content-Security-Policy.
    # Orígenes externos: Google Identity Services (login), Google Fonts (index.html) y teselas de
    # OpenStreetMap (EstablishmentMap.jsx, OSM_STYLE). `worker-src blob:` es de MapLibre.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ https://tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org; worker-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets aggressively (fingerprinted by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (e.g., seeding, exports)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # SPA fallback — any unmatched route serves index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
