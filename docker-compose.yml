version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: slep_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - slep_network
    restart: always

  backend:
    build:
      context: ./backend
    container_name: slep_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=slep_llanquihue
      - JWT_SECRET=super-secret-slep-key-2026-llanquihue-digital-management
      # Solo desarrollo: valores literales para poder levantar el entorno. En produccion
      # ninguno tiene default (ver docker-compose.prod.yml y .env.production.template).
      - ACCESS_TOKEN_EXPIRE_MINUTES=180
      - ADMIN_PASSWORD=dev-only-admin-password-change-me
      - BOOTSTRAP_ADMIN_EMAIL=admin@slepllanquihue.cl
      - ALLOWED_EMAIL_DOMAINS=slepllanquihue.cl
      - PASSWORD_MIN_LENGTH=15
      - PASSWORD_MAX_LENGTH=64
      - PASSWORD_REQUIRE_CHAR_CLASSES=0
      # Correo: en desarrollo el mensaje (con su enlace) sale por el log del backend.
      # `console` solo se acepta con PUBLIC_BASE_URL en localhost. Para probar el envío
      # real: MAIL_MODE=gmail y las cuatro variables de abajo en el .env de la raiz.
      - MAIL_MODE=${MAIL_MODE:-console}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5173}
      - GMAIL_SENDER_ADDRESS=${GMAIL_SENDER_ADDRESS:-}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./backend:/app
    depends_on:
      - mongodb
    networks:
      - slep_network
    restart: always

  frontend:
    build:
      context: ./frontend
    container_name: slep_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - slep_network
    restart: always

volumes:
  mongo_data:

networks:
  slep_network:
    driver: bridge
